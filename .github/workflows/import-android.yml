name: Compilar APK Hormigon Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patch/release02.txt'
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/import-android.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Codigo fuente
        uses: actions/checkout@v4
      - name: Aplicar actualización v0.2
        if: hashFiles('patch/release02.txt') != ''
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs'),zlib=require('node:zlib');
          const encoded=fs.readFileSync('patch/release02.txt','utf8').replace(/\\s+/g,'');
          const data=zlib.brotliDecompressSync(Buffer.from(encoded,'base64'));
          fs.writeFileSync('/tmp/release02.tar',data);
          JS
          tar -xf /tmp/release02.tar
          git rm -r patch
          git add src tests index.html README.md package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "feat: visualización 3D v0.2, fracturas, acero y telemetría"
          git push origin HEAD:main
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK del runner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME" | head -20
      - name: Ejecutar pruebas y compilar web
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Hormigon-Lab-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
